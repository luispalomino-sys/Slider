<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Personalizado</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/carrusel.css') }}">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <header class="py-6 text-center border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
        <h1 class="text-2xl font-bold tracking-wide text-cyan-400 uppercase">Galería Interactiva</h1>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 my-auto">
        <div class="relative overflow-hidden rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl">
            
            <div id="slider" class="flex transition-transform duration-700 ease-in-out">
                <div class="slide min-w-full relative h-[400px]">
                    <img src="{{ url_for('static', filename='img/img1.jpg') }}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent flex flex-col justify-end p-8">
                        <span class="text-cyan-400 text-xs font-semibold tracking-widest uppercase mb-1">Imagen 01</span>
                        <h2 class="text-2xl font-bold text-white">Diseño Dinámico</h2>
                    </div>
                </div>

                <div class="slide min-w-full relative h-[400px]">
                    <img src="{{ url_for('static', filename='img/img2.jpg') }}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent flex flex-col justify-end p-8">
                        <span class="text-cyan-400 text-xs font-semibold tracking-widest uppercase mb-1">Imagen 02</span>
                        <h2 class="text-2xl font-bold text-white">Integración Flask</h2>
                    </div>
                </div>

                <div class="slide min-w-full relative h-[400px]">
                    <img src="{{ url_for('static', filename='img/img3.jpg') }}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent flex flex-col justify-end p-8">
                        <span class="text-cyan-400 text-xs font-semibold tracking-widest uppercase mb-1">Imagen 03</span>
                        <h2 class="text-2xl font-bold text-white">Estilos Tailwind v4</h2>
                    </div>
                </div>
            </div>

            <button id="prevBtn" class="absolute left-4 top-1/2 -translate-y-1/2 bg-slate-900/80 hover:bg-cyan-500 hover:text-slate-950 text-white w-10 h-10 rounded-full flex items-center justify-center border border-slate-700 transition-all duration-300">
                &#10094;
            </button>
            <button id="nextBtn" class="absolute right-4 top-1/2 -translate-y-1/2 bg-slate-900/80 hover:bg-cyan-500 hover:text-slate-950 text-white w-10 h-10 rounded-full flex items-center justify-center border border-slate-700 transition-all duration-300">
                &#10095;
            </button>

            <div id="dots" class="absolute bottom-5 left-1/2 -translate-x-1/2 flex space-x-2"></div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        Rama develop &bull; Flask + JS + Tailwind v4
    </footer>

    <script src="{{ url_for('static', filename='js/carrusel.js') }}"></script>
</body>
</html>
